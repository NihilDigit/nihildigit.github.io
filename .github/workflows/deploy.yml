name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install dependencies
        run: deno install --frozen --allow-scripts=npm:sharp

      - name: Build CV PDF
        run: typst compile --root . cv/Shibo_Liu_CV.typ public/Shibo_Liu_CV.pdf

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          deno task astro build
          deno run -A npm:pagefind --site dist

      - name: Verify LLM text files
        run: |
          test -s dist/llms.txt
          test -s dist/llms-full.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
